name: CI

# CI only — no deploy step, since this project isn't hosted anywhere yet.
# Runs on every push and every pull request targeting main, so a broken
# build/test surfaces on GitHub before anyone has to notice it locally.
"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend — JUnit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B test
        # No live MySQL/Elasticsearch/OAuth2 credentials needed here — the
        # 8 test classes run against an in-memory H2 database (see
        # backend/src/test/resources/application.properties) or plain
        # Mockito mocks. That's exactly why we deliberately didn't write a
        # full @SpringBootTest integration test: this job would otherwise
        # need real infrastructure and secrets just to run in CI.

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
